<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f4f0e6" />
    <title>オフライン｜StanParty</title>
    <style>
      :root {
        color: #17231d;
        background: #f4f0e6;
        font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN",
          "Yu Gothic", Meiryo, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        margin: 0;
        padding: 24px;
      }

      main {
        width: min(100%, 460px);
        padding: 36px 28px;
        border: 2px solid #26372e;
        border-radius: 16px;
        background: #fffaf0;
        box-shadow: 6px 6px 0 #26372e;
        text-align: center;
      }

      .mark {
        width: 64px;
        height: 56px;
        display: grid;
        place-items: center;
        margin: 0 auto 28px;
        border-radius: 5px;
        color: #fffaf0;
        background: #17231d;
        box-shadow: 4px 4px 0 #e85d3f;
        font-size: 18px;
        font-weight: 900;
        letter-spacing: 0.04em;
        transform: rotate(-2deg);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 8vw, 2.4rem);
        line-height: 1.2;
        letter-spacing: -0.05em;
      }

      p {
        margin: 18px 0 28px;
        color: #657068;
        font-size: 0.95rem;
        font-weight: 600;
        line-height: 1.8;
      }

      button {
        min-height: 52px;
        padding: 0 24px;
        border: 2px solid #26372e;
        border-radius: 9px;
        color: white;
        background: #e85d3f;
        box-shadow: 4px 4px 0 #26372e;
        font: inherit;
        font-weight: 900;
        cursor: pointer;
      }

      button:active {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 #26372e;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">SP</div>
      <h1>インターネットに<br />接続できません</h1>
      <p>
        StanPartyのゲーム進行には通信が必要です。<br />
        接続を確認してから、もう一度お試しください。
      </p>
      <button type="button" onclick="window.location.reload()">もう一度読み込む</button>
    </main>
  </body>
</html>
